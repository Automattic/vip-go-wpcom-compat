name: PHP Lint

on:
  push:
    branches: [develop, master]
    paths:
      - '**.php'
      - 'composer.json'
      - '.phpcs.xml.dist'
      - '.github/workflows/php-lint.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - '**.php'
      - 'composer.json'
      - '.phpcs.xml.dist'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

# Disable all permissions by default; grant minimal permissions per job
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP Syntax and Coding Standards
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer, cs2pr

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-lock

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: --prefer-dist --no-progress

      - name: PHP syntax lint
        run: composer lint-ci | cs2pr

      - name: PHP coding standards
        run: composer cs -- --report=checkstyle | cs2pr
